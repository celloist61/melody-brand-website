name: Optimize Story preview images
on:
  push:
    branches: [about-learning-preview]
    paths: ['.github/workflows/optimize-story-preview.yml']
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: about-learning-preview
      - name: Install Pillow
        run: python -m pip install --quiet pillow
      - name: Optimize Story images and preserve full composition
        shell: python
        run: |
          from pathlib import Path
          from PIL import Image, ImageOps
          html=Path('about-preview.html')
          s=html.read_text(encoding='utf-8')
          original=s
          # Only Story photo CSS: natural image height and full composition.
          s=s.replace('.photo img{width:100%;height:100%;min-height:540px;display:block;object-fit:cover}', '.photo img{width:100%;height:auto;min-height:0;display:block;object-fit:contain}')
          s=s.replace('.photo{aspect-ratio:4/3}.photo img{height:100%;object-fit:cover}', '.photo{aspect-ratio:auto}.photo img{height:auto;object-fit:contain}')
          if s == original: raise SystemExit('Expected Story crop CSS markers not found')
          html.write_text(s,encoding='utf-8')

          refs=['story-01.jpg','story-02-correct.jpg','story-03.jpg','story-04.jpg','story-05a.jpg','story-06-correct.png','story-07-github.jpg']
          for name in refs:
              p=Path('assets')/name
              if not p.exists(): raise SystemExit(f'Missing Story asset: {p}')
              before=p.stat().st_size
              im=ImageOps.exif_transpose(Image.open(p)).convert('RGB')
              maxw=1600
              if im.width > maxw:
                  im=im.resize((maxw,round(im.height*maxw/im.width)),Image.Resampling.LANCZOS)
              if p.suffix.lower() in ('.jpg','.jpeg'):
                  im.save(p,'JPEG',quality=84,optimize=True,progressive=True)
              else:
                  new=p.with_suffix('.jpg')
                  im.save(new,'JPEG',quality=84,optimize=True,progressive=True)
                  s=s.replace('assets/'+p.name,'assets/'+new.name)
                  p.unlink(); p=new
              print(name,before,'->',p.stat().st_size)
          html.write_text(s,encoding='utf-8')
          final=html.read_text(encoding='utf-8')
          for term in ['01</span>','02</span>','03</span>','04</span>','05</span>','06</span>','07</span>','HOW I KEEP LEARNING','每一次進修，都是為了更懂你的身體。','美地 Melody</span><span class="nav-en">About']:
              if term not in final: raise SystemExit('QA missing: '+term)
      - name: Commit optimized preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add about-preview.html assets/
          git diff --cached --quiet && exit 0
          git commit -m "Optimize Story images without cropping"
          git push origin HEAD:about-learning-preview
