name: Patch preview navigation
on:
  push:
    branches: [about-learning-preview]
    paths: ['.github/workflows/patch-preview-nav.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: about-learning-preview
      - name: Patch four-page navigation safely
        shell: python
        run: |
          from pathlib import Path
          files = ['index.html','gyrotonic.html','learning-map.html','about-preview.html']
          about = '<a href="about-preview.html"><span class="nav-cn">美地 Melody</span><span class="nav-en">About</span></a>'
          about_active = '<a class="active" href="about-preview.html" aria-current="page"><span class="nav-cn">美地 Melody</span><span class="nav-en">About</span></a>'
          for fn in files:
              p=Path(fn); s=p.read_text(encoding='utf-8'); original=s
              if '美地 Melody</span><span class="nav-en">About' not in s:
                  marker='<a href="learning-map.html"><span class="nav-cn">線上學習地圖</span><span class="nav-en">Learning Map</span></a>'
                  marker_active='<a class="active" href="learning-map.html" aria-current="page"><span class="nav-cn">線上學習地圖</span><span class="nav-en">Learning Map</span></a>'
                  if marker_active in s:
                      s=s.replace(marker_active, marker_active+(about_active if fn=='about-preview.html' else about),1)
                  elif marker in s:
                      s=s.replace(marker, marker+(about_active if fn=='about-preview.html' else about),1)
                  else:
                      raise SystemExit(f'Navigation marker missing in {fn}')
              s=s.replace('flex:0 0 33.333%;min-width:112px','flex:0 0 25%;min-width:112px',1)
              if fn=='about-preview.html':
                  if '.site-nav a.active{' not in s:
                      needle='.site-nav a:first-child{border-left:1px solid var(--line)}'
                      addition='.site-nav a.active{background:var(--note);color:var(--ink);position:relative}.site-nav a.active:after{content:"";position:absolute;left:20px;right:20px;bottom:-1px;height:2px;background:var(--accent)}'
                      if needle not in s: raise SystemExit('About active CSS marker missing')
                      s=s.replace(needle,needle+addition,1)
              if len(s) < len(original)-10:
                  raise SystemExit(f'Unexpected shrink in {fn}')
              p.write_text(s,encoding='utf-8')
          # Structural checks
          checks={'about-preview.html':['01</span><span class="ch-title">很會努力','HOW I KEEP LEARNING','每一次進修，都是為了更懂你的身體。'], 'index.html':['TEACHING JOURNEY','Contact'], 'gyrotonic.html':['TEACHING JOURNEY','RHYFLO 花韻體苑'], 'learning-map.html':['Learning Map']}
          for fn,terms in checks.items():
              s=Path(fn).read_text(encoding='utf-8')
              if '美地 Melody</span><span class="nav-en">About' not in s: raise SystemExit(f'About nav missing in {fn}')
              for term in terms:
                  if term not in s: raise SystemExit(f'QA term missing in {fn}: {term}')
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html gyrotonic.html learning-map.html about-preview.html
          git diff --cached --quiet && exit 0
          git commit -m "Add Melody About to four-page navigation"
          git push origin HEAD:about-learning-preview
