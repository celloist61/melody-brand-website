<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teaching Journey Layout Preview｜美地 Melody</title><style>:root{--paper:#F4EFE7;--ink:#332C28;--muted:#746A64;--line:#D9CEC4;--accent:#A77C68;--note:#EFE5D8}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.8}.wrap{width:min(1120px,calc(100% - 40px));margin:auto}.section{padding:92px 0}.kicker{font-size:12px;letter-spacing:.18em;color:var(--accent);margin-bottom:22px}.journey-tabs{display:flex;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:0 0 52px;overflow-x:auto}.journey-tab{appearance:none;border:0;border-right:1px solid var(--line);background:transparent;color:var(--muted);font:inherit;font-size:14px;padding:17px 26px;cursor:pointer;white-space:nowrap}.journey-tab:first-child{border-left:1px solid var(--line)}.journey-tab.active{background:var(--note);color:var(--ink);box-shadow:inset 0 -2px 0 var(--accent)}.journey-panel{display:none}.journey-panel.active{display:grid;grid-template-columns:.38fr .62fr;gap:48px;align-items:start}.num{font-size:12px;letter-spacing:.16em;color:var(--accent)}h2{font-family:"Noto Serif TC","Songti TC","PMingLiU",serif;font-weight:500;line-height:1.28;font-size:clamp(32px,4vw,48px);margin:8px 0 10px}.meta{color:var(--muted);font-size:14px}.proof{display:inline-block;margin-top:20px;font-size:13px;color:inherit;text-decoration:none;border-bottom:1px solid var(--ink)}.media-link{min-height:220px;border:1px solid var(--line);display:flex;flex-direction:column;justify-content:center;padding:36px;background:rgba(255,255,255,.25)}.media-link p{margin:0 0 8px;color:#5E554F}.teaching-photos{display:grid;grid-template-columns:1fr 1fr;gap:12px}.teaching-photos img{width:100%;height:420px;object-fit:cover;display:block}.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.photo-grid img{width:100%;height:300px;object-fit:cover;display:block}.rhyflo-pair img{height:560px;object-fit:contain}@media(max-width:800px){.wrap{width:calc(100% - 36px)}.section{padding:64px 0}.journey-tabs{margin-bottom:34px}.journey-tab{padding:14px 18px;font-size:13px}.journey-panel.active{grid-template-columns:1fr;gap:24px}h2{font-size:38px}.teaching-photos,.photo-grid{grid-template-columns:1fr;gap:12px}.teaching-photos img,.photo-grid img,.rhyflo-pair img{height:auto;object-fit:contain}.media-link{min-height:0;padding:24px}}</style></head><body><section class="section"><div class="wrap"><div class="kicker">TEACHING JOURNEY</div><div class="journey-tabs" role="tablist"><button class="journey-tab active" data-target="rhyflo">花韻體苑</button><button class="journey-tab" data-target="at">AT 力場</button><button class="journey-tab" data-target="lovfit">Lovfit</button><button class="journey-tab" data-target="bounce">Bounce 8</button></div><div id="rhyflo" class="journey-panel active"><div><div class="num">01 · NOW</div><h2>RHYFLO 花韻體苑</h2><div class="meta">台北・南京復興｜墊上嬋柔教學</div><a class="proof" href="https://www.facebook.com/share/v/1JUZXW8fji/" target="_blank">查看公開教學紀錄 ↗</a></div><div class="teaching-photos rhyflo-pair"><img src="assets/rhyflo-gk (1).jpg"><img src="assets/rhyflo-gk-02.jpg"></div></div><div id="at" class="journey-panel"><div><div class="num">02</div><h2>AT 力場</h2><div class="meta">台北｜墊上嬋柔團體教學</div><p class="meta">從椅子到墊上，帶著學生在不同位置裡探索移動。</p></div><div class="photo-grid"><img src="assets/AT_GK_01.jpg"><img src="assets/AT_GK_03.jpg"><img src="assets/AT_GK_05.jpg"></div></div><div id="lovfit" class="journey-panel"><div><div class="num">03</div><h2>Lovfit</h2><div class="meta">新北・板橋｜墊上嬋柔教學</div><a class="proof" href="https://www.facebook.com/share/r/18ch3yFkik/" target="_blank">查看公開教學紀錄 ↗</a></div><div class="teaching-photos"><img src="assets/lovefit-01.jpg"><img src="assets/lovefit-02.jpg"></div></div><div id="bounce" class="journey-panel"><div><div class="num">04</div><h2>Bounce 8</h2><div class="meta">台北・天母｜墊上嬋柔教學</div><a class="proof" href="https://www.facebook.com/share/v/1MPd2FnZBK/" target="_blank">查看公開教學紀錄 ↗</a></div><div class="media-link"><p>台北天母的墊上嬋柔教學紀錄</p><a class="proof" href="https://www.facebook.com/share/v/1MPd2FnZBK/" target="_blank">觀看公開教學影片 ↗</a></div></div></div></section><script>const tabs=document.querySelectorAll('.journey-tab'),panels=document.querySelectorAll('.journey-panel');tabs.forEach(t=>t.onclick=()=>{tabs.forEach(x=>x.classList.remove('active'));panels.forEach(x=>x.classList.remove('active'));t.classList.add('active');document.getElementById(t.dataset.target).classList.add('active')});</script></body></html>
