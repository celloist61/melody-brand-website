ptimum Kinetics 系統性身體功能評估學</span></div><span></span><div class="cred" data-file="credential-sfa-2024-04-05.jpg">View credential ↗</div></div></div></article></div></div></section><section class="closing"><div class="wrap"><h2><span>每一次進修，都是為了更懂你的身體。</span><span>而你，也一直在教我。</span></h2></div></section><section class="contact"><div class="wrap"><h2>Contact</h2><div class="qr-row"><div class="qr-item"><img src="https://raw.githubusercontent.com/celloist61/melody-brand-website/main/assets/line-qr.jpg" alt="LINE QR">LINE<br><a href="https://line.me/ti/p/_EPDhQmJwH" target="_blank" rel="noopener" style="display:inline-block;margin-top:6px;text-decoration:none;border-bottom:1px solid var(--line);padding-bottom:1px;color:var(--ink)">跟我聊聊 →</a></div><div class="qr-item"><img src="https://raw.githubusercontent.com/celloist61/melody-brand-website/main/assets/instagram-qr.jpg" alt="Instagram QR">美地 Melody｜嬋柔老師<br>Instagram @celloist61</div></div></div></section><div class="note"><div class="wrap">GYROTONIC® 與 GYROKINESIS® 為 GYROTONIC Sales Corp. 的註冊商標。</div></div><footer><div class="wrap">美地 Melody｜嬋柔 GYROTONIC®・GYROKINESIS®　·　台北／新北</div></footer></main><script>const base='https://raw.githubusercontent.com/celloist61/melody-brand-website/main/assets/';const stories=[{n:'01',img:'preview-story-01.jpg',h:'那時候的我，<br>很會努力。',p:'研究所、CFA、金融業。<br>我一直相信——<br><strong>只要夠努力，人生就會往前。</strong>',next:'直到宇宙出了下一題 →'},{n:'02',img:'preview-story-02.jpg',h:'重新發牌',p:'人生不是方程式。<br>一場意外，<br>我摔斷了右手肱骨。<span class="stanza">等號左邊是我的努力，<br>右邊還混著運氣、意外，<br><strong>偶爾還有宇宙開的玩笑。</strong></span>',next:'重新發牌 →'},{n:'03',img:'preview-story-03.jpg',h:'牌沒有變少，<br>只是人生有不同玩法。',p:'我還是很想動。<br>復健、重訓、游泳……<br><strong>只有嬋柔，堅持下來。</strong>',next:'後來，它成為我的工作 →'},{n:'04',img:'preview-story-04.jpg',h:'最後留下來的嬋柔，<br>成為我的工作。',p:'曾經讓我重新認識身體的經歷，<br>慢慢變成——<br><strong>我陪別人認識身體的方式。</strong>',next:'故事還沒完 →'},{n:'05',img:'preview-story-05.jpg',h:'老師也有沒看懂的地方',p:'每天上課，我都在觀察學生的髖。<span class="stanza">卻一直不知道，自己的髖，長得不太一樣。</span><span class="stanza">原來我有先天髖關節發育不全。<br>2024年選擇做手術。</span><span class="stanza">走路、屈膝、上下樓梯——<br><strong>重新學了一次。</strong></span>',next:'重新學的，其實不只是走路 →'},{n:'06',img:'preview-story-06.jpg',h:'我還是很喜歡往前走',p:'甩開困惑：<br>「我還可以跟以前一樣嗎？」<span class="stanza">慢慢找回生活的可能，<br>出國的可能，<br>活蹦亂跳的可能。</span><span class="stanza">我不再覺得，一定要往前。</span><span class="stanza">停下來、退一步，偶爾關掉導航——<br><strong>看看自己現在在哪裡。</strong></span>',next:'最後一頁 →'},{n:'07',img:'preview-story-07.jpg',h:'今天，人來就好。',p:'今天，人來就好。<br><strong>我照顧你。</strong>',next:'看看我怎麼繼續學 →'}];const btns=[...document.querySelectorAll('.chapter')],stage=document.querySelector('.stage');let current=0,touchStartX=0;function show(i){current=i;stage.className='stage story-'+stories[i].n;btns.forEach((b,j)=>b.classList.toggle('active',i===j));const s=stories[i],dots=stories.map((_,j)=>'<button class="progress-dot'+(j===i?' active':'')+'" data-i="'+j+'" aria-label="Story '+(j+1)+'"></button>').join('');const final=i===stories.length-1;stage.innerHTML='<div class="photo"><img src="'+(s.img.startsWith('preview-story-')?'assets/':base)+s.img+'" decoding="async" alt="美地 Melody Story '+s.n+'"></div><div class="copy"><div class="num">'+s.n+' / 07</div><h3>'+s.h+'</h3><p>'+s.p+'</p><div class="story-progress"><div class="progress-row"><span class="progress-count">'+s.n+' / 07</span><div class="progress-dots">'+dots+'</div></div>'+(i===0?'<div class="swipe-hint">← 左右滑動，或點擊下一頁 →</div>':'')+'<div class="story-controls"><button class="story-prev" '+(i===0?'hidden':'')+' aria-label="'+(final?'回到故事開頭':'上一頁')+'">'+(final?'← 回到故事開頭':'← 上一頁')+'</button><button class="story-next"><span class="story-next-label">'+(final?'繼續往下':'下一頁')+' <span class="arrow">→</span></span><span class="story-next-hook">'+s.next.replace(/ →$/,'')+'</span></button></div></div></div>';stage.querySelectorAll('.progress-dot').forEach(d=>d.onclick=()=>show(+d.dataset.i));const prev=stage.querySelector('.story-prev'),next=stage.querySelector('.story-next');if(prev)prev.onclick=()=>final?show(0):show(Math.max(0,i-1));next.onclick=()=>{if(!final)show(i+1);else document.querySelector('#learning').scrollIntoView({behavior:'smooth'})};if(innerWidth<=760)btns[i].scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'})}btns.forEach((b,i)=>b.onclick=()=>show(i));stage.addEventListener('touchstart',e=>{touchStartX=e.changedTouches[0].clientX},{passive:true});stage.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-touchStartX;if(Math.abs(dx)<45)return;if(dx<0&&current<stories.length-1)show(current+1);if(dx>0&&current>0)show(current-1)},{passive:true});document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'&&current<stories.length-1)show(current+1);if(e.key==='ArrowLeft'&&current>0)show(current-1)});show(5);document.querySelectorAll('.toggle').forEach(b=>b.onclick=()=>{const p=b.closest('.path'),open=p.classList.toggle('open');b.textContent=open?'收起學習路徑 −':'查看學習路徑 ＋'});document.querySelectorAll('.cred[data-file]').forEach(c=>{const f=c.dataset.file;c.innerHTML='<a href="'+base+f+'" target="_blank" rel="noopener">View credential ↗</a>'});document.addEventListener('click',e=>{const prev=e.target.closest('.story-prev'),next=e.target.closest('.story-next'),toggle=e.target.closest('.toggle'),cred=e.target.closest('.cred a');if(prev&&current===5)gtag('event','story_prev_click',{story_number:'06'});if(next&&current===5)gtag('event','story_next_click',{story_number:'06'});if(toggle){const path=toggle.closest('.path');if(path&&!path.classList.contains('open')){const paths=[...document.querySelectorAll('.path')],pathName=paths.indexOf(path)===0?'gyrotonic_training':'body_study';gtag('event','learning_path_open',{learning_path:pathName})}}if(cred){const path=cred.closest('.path');const paths=[...document.querySelectorAll('.path')];if(path&&paths.indexOf(path)===1){const course=cred.closest('.course');gtag('event','credential_click',{credential_category:'body_study',credential_name:course?course.querySelector('strong')?.textContent.trim()||'body_study':'body_study'})}}},true);</script></body></html>
